# 即時推理管線設定
detector:
  model: yolov8s.pt
  conf: 0.4
  device: auto            # auto / cuda / cpu

tracker:                  # ByteTrack(supervision 實作)
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8

sampling:
  target_fps: 10          # 特徵取樣率(8-10 fps),依來源 fps 自動決定每 N 幀取樣

stream:                   # RTSP / YouTube / HTTP 串流(inference/stream.py)
  use_tcp: true
  connect_timeout_sec: 5.0
  reconnect_sec: 3.0
  max_height: 720         # YouTube 解析時偏好的最大畫面高度。
                          # ⚠ 調低**不會**變快:YOLO 內部一律縮到 imgsz=640,
                          # 實測 720p 與 480p 的 detect 都是 27ms,只差解碼
                          # 那 2ms。480p 反而因串流本身的分段節奏更慢。
                          # 這個值影響的是畫質與網路量,不是速度
  buffer_sec: 3.0         # HLS 佇列保留幾秒(滿了丟最舊的)
  prefill_sec: 5.0        # 開始供幀前先囤幾秒(= 刻意落後直播邊緣這麼多)。
                          # HLS 一段送完就空等,貼著直播邊緣跑會一頓一頓;
                          # 先囤起來讓存量吸收顛簸。代價是多這麼多延遲。
                          # ⚠ 只有在收幀跟得上即時時有效 —— 管線啟動時會印
                          # lag_ratio,<1 表示正被直播拉開,囤再多只是把
                          # 卡頓延後,要從別處省 CPU

escalation:               # 次數警戒等級(1 次低 / 2 次中 / ≥3 次高)
  window_sec: 90
  min_dwell: 2.0          # < 2 秒:戴耳機/扶眼鏡,不計
  max_dwell: 5.0          # > 5 秒一直舉著:講電話,不計
  min_gap: 2.0
  levels: {low: 0.2, mid: 0.5, high: 0.8}

loiter:                   # 逗留警告(背對看不到手 + 未大幅移動)
  enabled: true
  min_duration: 20.0
  move_ratio: 0.6
  wrist_vis_max: 0.1

skeleton:                 # 骨架輔助分支(計畫書 §4.5,late fusion)
  enabled: false          # 有訓練好的階段頭時可關閉;開啟則骨架驅動狀態機
  model: yolov8s-pose.pt
  near_ratio: 0.9         # 手在臉部區域(持菸時腕距鼻仍有一掌+菸長)
  move_ratio: 0.35
  kpt_conf: 0.3
  nose_conf: 0.5          # 鼻點專用門檻(背面幻覺鼻點過不了)
  min_scale_px: 24        # 身體尺度 < 此像素 → 棄權(太遠)
  kpt_err_px: 4.0         # 關鍵點像素誤差餘裕(遠距自動放寬)
  rise_margin: 0.5        # S2 須「由遠而近」(防手遮擋時的腕點幻覺)

move_gate:                # 移動排除(GUI 可開關)
  enabled: true
  max_heights: 3.0
  window_sec: 10.0

presence:                 # 在場型態:經過 / 徘徊 / 等待(純軌跡幾何)
  window_sec: 60.0        # 軌跡回看視窗(在場時長仍以首次出現起算)
  short_stay: 8.0         # 在場短於此秒數且有移動 → 經過
  long_stay: 20.0         # 在場超過此秒數才判徘徊/等待
  pass_path: 1.0          # 判「經過」的最小累積路徑(倍數×身高)
  wander_path: 3.0        # 累積路徑超過此值 → 徘徊,否則等待
  run_speed: 1.5          # 平均速度超過此值(身高/秒)→ 記為跑步
  path_dt: 0.5            # 累積路徑重取樣間隔(秒),見 inference_hmdb.yaml
  path_deadband: 0.05     # 單步位移小於此值(身高)視為抖動,不計入
  alert_wandering: false  # 徘徊時通報(GUI 可開關)。橘色警示,不是紅色
                          # 抽菸警報,也不影響 P_t —— 兩者語意不同
  alert_waiting: false    # 等待時通報(同上)
  smoking_requires_waiting: true
                          # 只有「等待」才判抽菸(見 inference_hmdb.yaml 的說明)

verify:                   # 第二階段複核(只有含 stage2 的方法會用到)
                          # 見 inference/verifier.py:降級不否決,判「非抽菸」
                          # 只把紅色警報降為橘色待複查,絕不取消
  window_sec: 90.0        # 往回取多長的節點序列複核(一根菸的節律需要 60-90 秒)
  min_smoking: 0.25       # 抽菸分數 ≥ 此值就維持紅色(降級門檻刻意比升級嚴)
  min_valid_ratio: 0.15   # 骨架有效幀比例低於此值 → 棄權,不做判定
  min_span_sec: 3.0       # 序列短於此秒數 → 棄權(放不進任何節律)
  device: auto

unverified:               # 背向 + 網路分數高 → 橘色「無法確認」警示
  back_frac: 0.6
  window_sec: 5.0
  net_score_min: 0.7
  save_dir: ./hard_cases
  save_cooldown_sec: 30.0

roi:
  ema_beta: 0.8           # 框 EMA 平滑係數
  aspect_ratio: 0.75      # 3:4(寬:高)
  upper_body_ratio: 0.6   # 取框上緣至 60% 高度
  jump_threshold: 0.5     # 框中心跳動超過(相對框對角線)視為異常,沿用前一幀平滑框
  out_size: 224

state_machine:
  window_sec: 8.0         # 滑動檢查視窗
  s2_min_dwell: 0.8       # S2 最短停留秒數
  sequence_bonus: 0.2     # 完整 S1→S2→S3 序列的規則側加成(見 inference_hmdb.yaml)
  weights:                # 單週期分數 = w_sm * 規則側分數 + w_net * 網路 cycle score
    state_machine: 0.5
    network: 0.5

alarm:
  ema_alpha: 0.9          # P_t = 0.9 * P_{t-1} + 0.1 * cycle_score
  trigger_threshold: 0.75
  release_threshold: 0.4
  sustain_sec: 3.0        # 超過觸發門檻需持續秒數
  min_events: 3           # 手到嘴事件 ≥ 此次數才通報(GUI 可調)
  count_floor: 0.8        # 次數達標時的單週期分數下限(不是拉滿 1.0,見 hmdb 版)
  count_driven: true      # 次數主導:次數達標+無排除條件 → 直接推向觸發
  clip_overlay: false     # 警報片段是否烙印骨架(關 = 乾淨影像,
                          # 蒐集訓練資料用;開 = 給人複查用)
  clip_pre_sec: 20.0       # 片段保留觸發前幾秒。標記指向「證據起點」
                          # (促成第一次計入的那次抬手),而抬手到警報
                          # 成立常隔十幾秒——這個值太小,標記跳得到但
                          # 片段拍不到動作的開頭。代價是記憶體:滾動
                          # 緩衝每秒約 10 張取樣影格
  snapshot_dir: ./alarms  # 觸發時截圖存檔位置

track_recycle_sec: 3.0    # track 消失超過此秒數即回收 buffer 與狀態

output:
  save_video: false
  video_path: ./output.mp4
