# 即時推理管線設定 — HMDB51 權重專用
# 自動標註無階段標籤 → 階段頭未訓練、狀態機恆為 0,
# 故單週期分數全交給網路 cycle score(state_machine 權重 0)。
# 自錄資料(含 S1-S3 標籤)訓練後請改用 inference.yaml。
detector:
  model: yolov8s.pt
  conf: 0.4
  device: auto            # auto / cuda / cpu

tracker:                  # ByteTrack(supervision 實作)
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8

sampling:
  target_fps: 10          # 特徵取樣率(8-10 fps),依來源 fps 自動決定每 N 幀取樣

stream:                   # RTSP / YouTube / HTTP 串流(inference/stream.py)
  use_tcp: true           # RTSP 走 TCP,避免 UDP 掉包花屏
  connect_timeout_sec: 5.0
  reconnect_sec: 3.0      # 斷線重連間隔
  max_height: 720         # YouTube 解析時偏好的最大畫面高度。
                          # ⚠ 調低**不會**變快:YOLO 內部一律縮到 imgsz=640,
                          # 實測 720p 與 480p 的 detect 都是 27ms,只差解碼
                          # 那 2ms。480p 反而因串流本身的分段節奏更慢。
                          # 這個值影響的是畫質與網路量,不是速度
  buffer_sec: 3.0         # HLS 佇列保留幾秒(滿了丟最舊的)
  prefill_sec: 5.0        # 開始供幀前先囤幾秒(= 刻意落後直播邊緣這麼多)。
                          # HLS 一段送完就空等,貼著直播邊緣跑會一頓一頓;
                          # 先囤起來讓存量吸收顛簸。代價是多這麼多延遲。
                          # ⚠ 只有在收幀跟得上即時時有效 —— 管線啟動時會印
                          # lag_ratio,<1 表示正被直播拉開,囤再多只是把
                          # 卡頓延後,要從別處省 CPU

escalation:               # 次數警戒等級:以手到嘴事件「次數」逐級升高
  window_sec: 90          # 滾動視窗
  min_dwell: 2.0          # 停留 < 此秒數 → 戴耳機/扶眼鏡/摸臉,不計
  max_dwell: 5.0          # 停留 > 此秒數(一直舉著)→ 講電話,不計
  min_gap: 2.0            # 事件間最小間隔(避免同一口重複計數)
  levels: {low: 0.2, mid: 0.5, high: 0.8}   # 1 次 / 2 次 / ≥3 次

presence:                 # 在場型態:經過 / 徘徊 / 等待(純軌跡幾何)
  window_sec: 60.0        # 軌跡回看視窗(在場時長仍以首次出現起算)
  short_stay: 8.0         # 在場短於此秒數且有移動 → 經過
  long_stay: 20.0         # 在場超過此秒數才判徘徊/等待
  pass_path: 1.0          # 判「經過」的最小累積路徑(倍數×身高)
  wander_path: 3.0        # 累積路徑超過此值 → 徘徊,否則等待
  run_speed: 1.5          # 平均速度超過此值(身高/秒)→ 記為跑步
  alert_wandering: false  # 徘徊時通報(GUI 可開關)。橘色警示,不是紅色
                          # 抽菸警報,也不影響 P_t —— 兩者語意不同
  alert_waiting: false    # 等待時通報(同上)。站著不動的人才是抽菸的
                          # 主要對象,所以這個開關比徘徊更常用得到
  smoking_requires_waiting: true
                          # 只有「等待」才判抽菸。抽菸是站定了才做的事,
                          # 經過與徘徊的人手臂擺動很像手到嘴。
                          # 這比 move_gate 嚴格:move_gate 看 10 秒內的位移,
                          # 剛進畫面、型態還在「判定中」的人擋不住。
                          # 注意「等待」要在場滿 long_stay 秒(預設 20)才成立

move_gate:                # 移動排除(GUI 可開關):走動中不視為抽菸
  enabled: true
  max_heights: 3.0        # 視窗內累積移動 ≥ N 倍人物身高 → 排除
  window_sec: 10.0

loiter:                   # 逗留警告:背對看不到手 + 未大幅移動
  enabled: true
  min_duration: 20.0      # 在場觀察秒數
  move_ratio: 0.6         # 位移 < 此比例×框對角線 視為未移動
  wrist_vis_max: 0.1      # 手腕可見幀比例 ≤ 此值 視為看不到手

skeleton:                 # 骨架輔助分支(計畫書 §4.5)
  enabled: true           # 啟用:pose 模型取代偵測器,狀態機改吃骨架階段
  model: yolov8s-pose.pt
  near_ratio: 0.9         # 腕-鼻距離 < 此比例×身體尺度 → S2 手在臉部區域
                          # (持菸時指尖碰唇、腕距鼻仍有一掌+菸長,0.6 會漏)
  move_ratio: 0.35        # 0.6 秒內變化超過此比例×肩寬 → S1 舉手 / S3 放下
  kpt_conf: 0.3           # 關鍵點最低置信度
  nose_conf: 0.5          # 鼻點專用門檻(較嚴):背面幻覺鼻點過不了
  min_scale_px: 24        # 身體尺度 < 此像素 → 棄權(太遠,關鍵點不可靠)
  kpt_err_px: 4.0         # 關鍵點像素誤差餘裕(遠距自動放寬相對門檻)
  rise_margin: 0.5        # S2 須「由遠而近」:手先離臉 ≥ near+此值才採信
                          # (手背身後時腕點被高置信幻覺在衣領附近,
                          #  幻覺點永遠不會先遠離再靠近)

verify:                   # 第二階段複核(只有含 stage2 的方法會用到)
                          # 見 inference/verifier.py:降級不否決,判「非抽菸」
                          # 只把紅色警報降為橘色待複查,絕不取消
  window_sec: 90.0        # 往回取多長的節點序列複核(一根菸的節律需 60-90 秒)
  min_smoking: 0.25       # 抽菸分數 ≥ 此值就維持紅色(降級門檻刻意比升級嚴)
  min_valid_ratio: 0.15   # 骨架有效幀比例低於此值 → 棄權,不做判定
  min_span_sec: 3.0       # 序列短於此秒數 → 棄權(放不進任何節律)
  device: auto

unverified:               # 背向 + 網路分數高 → 橘色「無法確認」警示
  back_frac: 0.6          # 近期視窗內背向幀比例 ≥ 此值 視為背向
  window_sec: 5.0
  net_score_min: 0.7      # 網路分數 ≥ 此值才升橘色(並存 hard case)
  save_dir: ./hard_cases  # 背向高分案例存檔(重訓資料來源)
  save_cooldown_sec: 30.0 # 每 track 存檔冷卻,避免重複

roi:
  ema_beta: 0.8           # 框 EMA 平滑係數
  aspect_ratio: 0.75      # 3:4(寬:高)
  upper_body_ratio: 0.6   # 取框上緣至 60% 高度
  jump_threshold: 0.5     # 框中心跳動超過(相對框對角線)視為異常,沿用前一幀平滑框
  out_size: 224

state_machine:            # ⚠ 這兩個目前**不影響任何行為**。
                          # StageStateMachine 每幀被 push(),但它的 score()
                          # 在 pipeline 與 GUI 裡從來沒有被呼叫過(只有測試在用)
                          # —— 它是 2026-07「次數警戒取代單次動作觸發」之前
                          # 的舊機制,被 HandToMouthCounter 取代後沒清乾淨。
                          # 它原本要守的三件事現在都有人守了:
                          #   S1 在 S2 前 → SkeletonStageEstimator 的 armed 機制
                          #   S2 停留下限 → escalation.min_dwell(2.0,更嚴)
                          #   S3 在 S2 後 → 方法 rule+order(require_release)
                          # 待 rule+order 有定論後連同這個區塊一起移除。
  window_sec: 8.0         # (無效果)滑動檢查視窗
  s2_min_dwell: 0.8       # (無效果)S2 最短停留秒數

fusion:                   # 融合分數(只有 hybrid 家族會用)
  count: 0.4                # 手到嘴「次數警戒」分數的權重
    # 喝水也有手到嘴動作,骨架權重略低於網路
  network: 0.6              # 外觀網路 cycle score 的權重
                          # ⚠ 舊版把這兩個放在 state_machine.weights 底下,
                          #   名字讓人以為是狀態機分數的權重 —— 不是。
                          #   第一項乘的一直都是 HandToMouthCounter 的分數

alarm:
  ema_alpha: 0.9          # P_t = 0.9 * P_{t-1} + 0.1 * cycle_score
  trigger_threshold: 0.6  # HMDB 權重校準:抽菸 P 峰值 0.65-0.98,混淆動作 <0.13
  release_threshold: 0.3
  sustain_sec: 2.0        # 短片段(HMDB 多為 4-9 秒)需較短持續時間
  min_events: 2           # 手到嘴事件 ≥ 此次數才通報(GUI 可調)
  count_driven: true      # 次數主導:次數達標+無排除條件 → 直接推向觸發
                          # (否則 0.4×次數分上限 0.32 過不了觸發線,
                          #  警報實質被網路分數決定,次數形同虛設)
  clip_overlay: false     # 警報片段是否烙印骨架(關 = 乾淨影像,
                          # 蒐集訓練資料用;開 = 給人複查用)
  clip_pre_sec: 10.0       # 片段保留觸發前幾秒。標記指向「證據起點」
                          # (促成第一次計入的那次抬手),而抬手到警報
                          # 成立常隔十幾秒——這個值太小,標記跳得到但
                          # 片段拍不到動作的開頭。代價是記憶體:滾動
                          # 緩衝每秒約 10 張取樣影格
  snapshot_dir: ./alarms  # 觸發時截圖存檔位置

track_recycle_sec: 3.0    # track 消失超過此秒數即回收 buffer 與狀態

output:
  save_video: false
  video_path: ./output.mp4
